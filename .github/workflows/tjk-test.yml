name: TJK erisim testi
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: TJK'ya GitHub sunucusundan istek at
        run: |
          set +e
          D=$(TZ=Europe/Istanbul date +%d/%m/%Y)
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36"
          echo "### TJK erisim testi ($D)" >> $GITHUB_STEP_SUMMARY
          echo "| Sayfa | UA | HTTP | Boyut | Sn | Gercek icerik | Engel |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          test_url () {
            name="$1"; url="$2"; ua_name="$3"; ua="$4"
            out=$(curl -s -o /tmp/p.html -w "%{http_code} %{size_download} %{time_total}" -m 30 -A "$ua" -H "Accept-Language: tr-TR,tr;q=0.9" "$url")
            code=$(echo $out | cut -d' ' -f1); size=$(echo $out | cut -d' ' -f2); t=$(echo $out | cut -d' ' -f3)
            real="HAYIR"; grep -qi -E "SehirId|Yar[ıi]s" /tmp/p.html && real="EVET"
            blk="yok"; grep -qi -E "captcha|access denied|forbidden|attention required" /tmp/p.html && blk="VAR"
            echo "| $name | $ua_name | $code | $size | $t | $real | $blk |" >> $GITHUB_STEP_SUMMARY
            echo "$name ($ua_name): $code $size bayt, icerik=$real, engel=$blk"
          }
          ENC=$(printf %s "$D" | sed 's#/#%2F#g')
          P="https://www.tjk.org/TR/yarissever/Info/Page/GunlukYarisProgrami?QueryParameter_Tarih=$ENC&Era=today"
          for i in 1 2 3; do
            test_url "Program #$i" "$P" "tarayici" "$UA"
            sleep 2
          done
          test_url "Program" "$P" "curl" "curl/8.0"
          test_url "Ana sayfa" "https://www.tjk.org/" "tarayici" "$UA"
          exit 0
