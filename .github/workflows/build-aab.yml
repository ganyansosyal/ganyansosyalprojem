name: AAB derle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android projesini üret
        run: |
          flutter create --platforms=android --org com.ganyansosyal --project-name ganyansosyal_native .
          git checkout -- pubspec.yaml lib/main.dart
          rm -rf test
          # Play'deki uygulamanın paket adı (namespace aynı kalır, sadece applicationId değişir)
          sed -i 's#applicationId = "[^"]*"#applicationId = "io.github.ganyansosyal.app"#' android/app/build.gradle.kts
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # LevelPlay reklam SDK'sı ağ durumu izni ister
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Reklam kimliği izni (Android 12+)
          sed -i 's#<application#<uses-permission android:name="com.google.android.gms.permission.AD_ID"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # LevelPlay Unity Ads adaptörü (Android Gradle bağımlılığı)
          printf '\ndependencies {\n    implementation("com.unity3d.ads-mediation:unityads-adapter:5.15.0")\n}\n' >> android/app/build.gradle.kts
          # Kupon görselini galeriye kaydetmek için (Android 9 ve altı)
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Impeller çizim motoru bazı telefonlarda kaydırmada takılıyor: kapat
          sed -i 's#</application>#    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          # AdMob uygulama kimliği (şimdilik Google TEST kimliği; gerçek kimlikle değiştirilecek)
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1340335815297540~7852834540"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="GanyanSosyal"#' android/app/src/main/AndroidManifest.xml
          # Firebase eklentileri en az Android 6 (API 23) ister
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 23)/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion Math.max(flutter.minSdkVersion, 23)/' android/app/build.gradle 2>/dev/null || true

      - name: Sabit imza anahtarını hazırla
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: |
          echo "$KS_BASE64" | base64 -d > android/app/release.keystore
          python3 - <<'PY'
          p='android/app/build.gradle.kts'
          s=open(p).read()
          block='''android {
              signingConfigs {
                  create("release") {
                      storeFile = file("release.keystore")
                      storePassword = System.getenv("KS_PASS")
                      keyAlias = System.getenv("KS_ALIAS")
                      keyPassword = System.getenv("KS_PASS")
                  }
              }
          '''
          s=s.replace('android {',block,1)
          s=s.replace('signingConfigs.getByName("debug")','signingConfigs.getByName("release")')
          s=s.replace('signingConfig = signingConfigs.getByName("release")','signingConfig = signingConfigs.getByName("release")\n            isMinifyEnabled = false\n            isShrinkResources = false',1)
          open(p,'w').write(s)
          PY

      - run: flutter pub get

      - name: Uygulama simgesini üret
        run: dart run flutter_launcher_icons

      - run: flutter build appbundle --release --no-shrink
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}

      - uses: actions/upload-artifact@v4
        with:
          name: ganyansosyal-aab
          path: build/app/outputs/bundle/release/app-release.aab
