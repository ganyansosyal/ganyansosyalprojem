name: ganyansosyal_native
description: GanyanSosyal native uygulama
publish_to: "none"
version: 0.3.1+100

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  firebase_core: any
  firebase_auth: any
  google_sign_in: ^7.2.0
  cloud_firestore: any
  image_picker: any
  http: ^1.2.0
  cached_network_image: ^3.4.1
  html: ^0.15.4
  url_launcher: ^6.2.0
  path_provider: ^2.1.0
  share_plus: ^10.1.4
  gal: ^2.3.1
  video_player: ^2.9.0
  youtube_player_iframe: ^6.0.2
  flutter_displaymode: any
  google_mobile_ads: ^9.1.0
  unity_levelplay_mediation: ^9.4.0
  in_app_update: ^4.2.3
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0E7C5B"
  adaptive_icon_foreground: "assets/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
